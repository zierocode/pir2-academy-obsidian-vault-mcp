name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  source:
    name: Source (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run smoke
      - run: npm run scan:secrets
      - run: npm run bundle
      - run: npm run bundle:verify
